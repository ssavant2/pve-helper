version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      frontend-tooling:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      container-bases:
        patterns:
          - "*"

  # The docker ecosystem reads Dockerfiles only, so the images pinned in the
  # compose files drifted unattended. The Playwright runner is excluded on
  # purpose: it has to move in the same commit as @playwright/test in /e2e,
  # which is a different ecosystem and therefore a different pull request.
  # scripts/check_playwright_pin.py enforces that pairing.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: mcr.microsoft.com/playwright

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

