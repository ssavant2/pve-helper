name: pve-helper-dev-tools

services:
  py-check:
    image: ghcr.io/astral-sh/ruff:0.14.14@sha256:7e2b474dd2407be9928985d48a66863fd658c03c7dedfbde65595772de61f15d
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["check", "."]
    volumes:
      - .:/workspace

  py-format-check:
    image: ghcr.io/astral-sh/ruff:0.14.14@sha256:7e2b474dd2407be9928985d48a66863fd658c03c7dedfbde65595772de61f15d
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["format", "--check", "."]
    volumes:
      - .:/workspace

  py-format:
    image: ghcr.io/astral-sh/ruff:0.14.14@sha256:7e2b474dd2407be9928985d48a66863fd658c03c7dedfbde65595772de61f15d
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["format", "."]
    volumes:
      - .:/workspace

  js-check:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: bridge
    command: sh -lc "npm ci --no-audit --no-fund && npm run check"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - .:/workspace

  js-format:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: bridge
    command: sh -lc "npm ci --no-audit --no-fund && npm run format"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - .:/workspace

  # --- Dev-only Playwright E2E stack. Isolated + prod-safe: uses the app image
  # with APP_REQUIRE_LOGIN off, PVE network disabled and a throwaway SQLite DB, so
  # it needs no login, no Proxmox and no Postgres role. None of this ships in the
  # deployed image (docker-compose.yml + Dockerfile never reference it).
  # Run: docker compose -f docker-compose.tools.yml run --rm e2e
  e2e-web:
    image: pve-helper-dev:local
    environment:
      DEBUG: "true"
      APP_REQUIRE_LOGIN: "false"
      APP_BASE_URL: http://e2e-web:8000
      PVE_TEST_NETWORK_DISABLED: "true"
      PVE_ENDPOINTS: ""
      DB_ENGINE: sqlite
      DB_NAME: /tmp/e2e/db.sqlite3
      APP_SECRET_KEY: e2e-not-a-secret
      ALLOWED_HOSTS: "e2e-web,localhost,127.0.0.1"
    command: >
      sh -lc "mkdir -p /tmp/e2e && python manage.py migrate --noinput &&
      python manage.py shell -c \"from django.utils import timezone; from core.models import StorageMount, ScanRun, ProxmoxCluster, ProxmoxEndpoint, CurrentGuestInventory, CurrentGuestInventoryState, AuditEvent, ClusterStorage, ClusterStorageMount, ClusterStorageNodeState, ProxmoxStorageConsumer;
      StorageMount.objects.get_or_create(storage_id='e2e-store', defaults={'display_name':'E2E Store','path':'/tmp/e2e-store'});
      c=ProxmoxCluster.objects.create(key='e2e', display_name='E2E cluster', enabled=True);
      r=ProxmoxCluster.objects.create(key='retired-e2e', display_name='Retired E2E cluster', enabled=False, discovered_name='Former E2E cluster', retired_at=timezone.now(), retirement_mode='forced', retirement_reason='The E2E site was permanently decommissioned.', retired_ca_uuid='22222222-2222-2222-2222-222222222222', retired_ca_fingerprint='AA:BB:CC');
      u=ProxmoxCluster.objects.create(key='unused-e2e', display_name='Unused E2E connection', enabled=False, discovered_ca_uuid='33333333-3333-3333-3333-333333333333');
      ProxmoxEndpoint.objects.create(cluster=u, name='pve1', url='https://pve1.unused-e2e.test:8006/');
      s=ScanRun.objects.create(status=ScanRun.Status.COMPLETED, progress_message='e2e seed');
      CurrentGuestInventory.objects.create(cluster=c, source_scan=s, node='pve1', object_type='vm', vmid=100, name='e2e-vm-running', status='running', config={'tags':'prod'}, observed_at=timezone.now());
      CurrentGuestInventory.objects.create(cluster=c, source_scan=s, node='pve1', object_type='vm', vmid=101, name='e2e-vm-stopped', status='stopped', observed_at=timezone.now());
      CurrentGuestInventoryState.objects.create(cluster=c, refreshed_at=timezone.now(), complete=False, endpoints_attempted=['pve1','pve2'], endpoints_succeeded=['pve1'], errors={'live_inventory':['pve2 unavailable']}, source_scan=s);
      ns=ClusterStorage.objects.create(cluster=c, storage_id='e2e-nfs', storage_type='nfs', shared=True, present=True, config={'server':'nas.e2e.local','export':'/mnt/tank/vm'});
      ls=ClusterStorage.objects.create(cluster=c, storage_id='e2e-dir', storage_type='dir', shared=False, present=True, config={'path':'/var/lib/vz'});
      cm=StorageMount.objects.create(storage_id='e2e-nfs', display_name='E2E shared storage', path='/tmp/e2e-nfs');
      ClusterStorageMount.objects.create(cluster_storage=ns, mount=cm, scope='shared');
      ProxmoxStorageConsumer.objects.create(storage=cm, cluster=c, expected_node_name='pve1', last_successful_inventory_scan=timezone.now(), last_gate_status='ok');
      ClusterStorageNodeState.objects.create(cluster_storage=ls, node='pve1', present=True, active=True, enabled=True);
      AuditEvent.objects.create(username='e2e', action='tag.bulk_operation', object_type='tag', object_id='old-tag', outcome='failed', details={'cluster_key':'e2e','operation':'delete','source_tag':'old-tag','targets':[{'cluster_key':'e2e','node':'pve1','object_type':'vm','vmid':100}],'failed':[{'vmid':100,'reason':'locked'}],'retryable':True});
      AuditEvent.objects.create(username='e2e', action='cluster.force_retired', object_type='cluster', object_id='retired-e2e', outcome='success', cluster=r, cluster_key_snapshot='retired-e2e', details={'display_name':'Retired E2E cluster','cluster_key':'retired-e2e','retirement_mode':'forced','retirement_reason':'The E2E site was permanently decommissioned.','identity_verification':'skipped','endpoint_count':2,'cleanup':{'schedules_deleted':1,'current_guests_deleted':2}});
      AuditEvent.objects.create(username='e2e', action='file.bulk_operation', object_type='storage', object_id='e2e-store', outcome='warning', module='storage', cluster=c, cluster_key_snapshot='e2e', storage_id='e2e-store', details={'verb':'moved to trash','operation':'trash','storage_id':'e2e-store','storage_name':'E2E Store','summary':'1 of 2 files moved to trash','total':2,'question':True,'succeeded':['dump/ok.vma.zst'],'failed':[{'path':'images/100/vm-100-disk-0.qcow2','error':'Permission denied.'}],'skipped':[],'retry':{'url':'/storage/e2e-store/trash-file/','paths':['images/100/vm-100-disk-0.qcow2']}})\" &&
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/vms/overview/')"]
      interval: 3s
      timeout: 5s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    working_dir: /workspace/e2e
    environment:
      BASE_URL: http://e2e-web:8000
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -lc "npm ci --no-audit --no-fund && npx playwright test"
    volumes:
      - .:/workspace
    depends_on:
      e2e-web:
        condition: service_healthy
