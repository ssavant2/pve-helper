name: pve-helper-dev-tools

services:
  py-check:
    image: ghcr.io/astral-sh/ruff:0.17.4@sha256:c4b7e7a87e4b07d66b569dd2e6b2ce5a25e38be91dd664dc49b9882be27acd9b
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["check", "."]
    volumes:
      - .:/workspace

  py-format-check:
    image: ghcr.io/astral-sh/ruff:0.17.4@sha256:c4b7e7a87e4b07d66b569dd2e6b2ce5a25e38be91dd664dc49b9882be27acd9b
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["format", "--check", "."]
    volumes:
      - .:/workspace

  py-format:
    image: ghcr.io/astral-sh/ruff:0.17.4@sha256:c4b7e7a87e4b07d66b569dd2e6b2ce5a25e38be91dd664dc49b9882be27acd9b
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: none
    command: ["format", "."]
    volumes:
      - .:/workspace

  js-check:
    image: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: bridge
    command: sh -lc "npm ci --no-audit --no-fund && npm run check"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - .:/workspace

  js-format:
    image: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    network_mode: bridge
    command: sh -lc "npm ci --no-audit --no-fund && npm run format"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - .:/workspace

  # --- Dev-only Playwright E2E stack. Isolated + prod-safe: uses the app image
  # with APP_REQUIRE_LOGIN off, PVE network disabled and a throwaway SQLite DB, so
  # it needs no login, no Proxmox and no Postgres role. None of this ships in the
  # deployed image (docker-compose.yml + Dockerfile never reference it).
  # Run: docker compose -f docker-compose.tools.yml run --rm e2e
  e2e-web:
    image: pve-helper-dev:local
    environment:
      DEBUG: "true"
      APP_REQUIRE_LOGIN: "false"
      APP_BASE_URL: http://e2e-web:8000
      PVE_TEST_NETWORK_DISABLED: "true"
      PVE_ENDPOINTS: ""
      DB_ENGINE: sqlite
      DB_NAME: /tmp/e2e/db.sqlite3
      APP_SECRET_KEY: e2e-not-a-secret
      # Throwaway keyring so the seed can store a credential; the E2E stack never
      # reaches Proxmox and its SQLite database is discarded with the container.
      PVE_HELPER_ENCRYPTION_KEYS: "e2e:ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU="
      PVE_HELPER_ENCRYPTION_ACTIVE_KEY_ID: e2e
      E2E_SEED_SCENARIO: "${E2E_SEED_SCENARIO:-representative}"
      ALLOWED_HOSTS: "e2e-web,localhost,127.0.0.1"
    command: >
      sh -lc "mkdir -p /tmp/e2e && python manage.py migrate --noinput &&
      python scripts/e2e_seed.py --scenario $${E2E_SEED_SCENARIO:-representative} &&
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/vms/overview/')"]
      interval: 3s
      timeout: 5s
      retries: 30

  e2e:
    # Must track @playwright/test in e2e/package.json: the image ships only the
    # browser build its own version expects, so a lone npm bump leaves every test
    # failing on a missing executable.
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    working_dir: /workspace/e2e
    environment:
      BASE_URL: http://e2e-web:8000
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    command: sh -lc "npm ci --no-audit --no-fund && npx playwright test"
    volumes:
      - .:/workspace
    depends_on:
      e2e-web:
        condition: service_healthy
